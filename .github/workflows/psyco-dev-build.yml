---
name: VPN.vu Desktop - Dev Smoke Test
on:
  push:
    branches:
      - psyco-fork
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!audits/**"
      - "!graphics/**"
      - "!.gitignore"
      - "!LICENSE.md"
  pull_request:
    branches:
      - psyco-fork
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!audits/**"
      - "!graphics/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: psyco-dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test-windows:
    name: Smoke test (Windows x64, no installer)
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Set git config for long paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        uses: ./.github/actions/mullvad-build-env
        with:
          rust-cache-targets: "true"

      - name: Cache desktop node_modules
        uses: actions/cache@v4
        with:
          path: |
            desktop/node_modules
            desktop/packages/*/node_modules
          key: ${{ runner.os }}-desktop-node-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-desktop-node-

      - name: Install Rust target aarch64-pc-windows-msvc (for arm64 cross-compile check)
        shell: bash
        run: rustup target add aarch64-pc-windows-msvc

      - name: Build Windows C++ modules (winfw only — fastest smoke)
        shell: bash
        run: ./build-windows-modules.sh build winfw

      - name: Cargo check daemon (no-default-features, fast)
        shell: bash
        run: cargo check --workspace --no-default-features --exclude windows-installer

      # Smoke-check arm64 cross-compile of the daemon crate only.
      # Catches breakage in PRs without paying the cost of a full arm64 build.
      - name: Cargo check daemon for arm64 (cross)
        shell: bash
        run: cargo check -p mullvad-daemon --target aarch64-pc-windows-msvc --no-default-features

      - name: Install desktop dependencies
        working-directory: desktop
        shell: bash
        run: npm run ci

      - name: TypeScript type-check (vpnvu-desktop package)
        working-directory: desktop
        shell: bash
        run: npm run type-check -w vpnvu-desktop

      - name: Build test bundle (Electron renderer)
        working-directory: desktop
        shell: bash
        run: npm run build:test -w vpnvu-desktop