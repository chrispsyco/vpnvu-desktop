---
name: VPN.vu Desktop - Release Build
on:
  push:
    tags:
      # Real-daemon release tags. Demo (mock) builds use v*-demo, matched by
      # psyco-demo.yml so the two workflows don't fight.
      #   v*-dev     : legacy dev artifacts (still accepted)
      #   20*-beta*  : version-named beta tags — the tag name MUST equal
      #                desktop-product-version.txt (e.g. 2026.6-beta1) so
      #                mullvad-version drops the -dev-<hash> suffix and the app
      #                reports the clean version.
      - "v*-dev"
      - "20*-beta*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. 0.1.0-dev). Used in artifact filename."
        type: string
        required: true
        default: "0.0.0-dev"
      sign:
        description: "Code-sign + notarize (Windows EV via SSL.com eSigner, macOS via Apple Developer ID). Needs the signing secrets — see docs/code-signing-setup.md. Leave false until the certs are issued to TMBS LLC."
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: psyco-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows ${{ matrix.arch }} installer
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # If x64 succeeds and arm64 fails (or vice versa), still publish the one
      # that worked instead of cancelling both.
      fail-fast: false
      matrix:
        include:
          # x64 cross-compiles fine on the standard runner.
          - arch: x64
            os: windows-latest
            artifact-suffix: x64
          # arm64 needs the native windows-11-arm runner because the .vcxproj
          # files pin PlatformToolset=v143 (VS 2022) which is no longer present
          # on windows-latest (which now redirects to VS 2026 / v180). Mullvad
          # upstream uses the same approach in .github/workflows/daemon.yml.
          - arch: arm64
            os: windows-11-arm
            artifact-suffix: arm64
    steps:
      - name: Set git config for long paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build environment (Rust + protoc + Go + Node + MSBuild + Zig)
        uses: ./.github/actions/mullvad-build-env
        with:
          rust-cache-targets: "true"

      - name: Install additional Rust targets
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add i686-pc-windows-msvc
          rustup target add aarch64-pc-windows-msvc

      - name: Cache desktop node_modules
        uses: actions/cache@v4
        with:
          path: |
            desktop/node_modules
            desktop/packages/*/node_modules
          key: ${{ runner.os }}-desktop-node-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-desktop-node-

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building VPN.vu Desktop ${{ matrix.arch }} version: $VERSION"

      # On the arm64 runner (4 cores), cap MSBuild concurrency to avoid OOM,
      # matching what Mullvad upstream does in .github/workflows/daemon.yml.
      - name: Build Windows C++ modules (winfw + nsis-plugins)
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            # PSYCO: serialize (1) on ARM64 — 2 still OOM'd the PCH (C1076 + C3859) on the current
            # windows-11-arm runner (VS 14.44). Combined with /Zm800 in build-windows-modules.sh.
            ./build-windows-modules.sh --max-concurrent-processes 1 build winfw nsis-plugins
          else
            ./build-windows-modules.sh build winfw nsis-plugins
          fi

      - name: Install desktop dependencies
        working-directory: desktop
        shell: bash
        run: npm run ci

      # Both jobs build natively (HOST == target). No cross-compile needed because
      # arm64 uses a native windows-11-arm runner.
      - name: Build daemon + GUI installer (release, unsigned) for ${{ matrix.arch }}
        shell: bash
        run: ./build.sh --optimize

      - name: Locate installer artifact
        id: artifact
        shell: bash
        run: |
          INSTALLER=$(ls -1 dist/*_${{ matrix.artifact-suffix }}.exe 2>/dev/null | head -n1 || true)
          if [[ -z "$INSTALLER" ]]; then
            echo "ERROR: No ${{ matrix.arch }} installer found in dist/"
            ls -la dist/ || true
            exit 1
          fi
          echo "Found installer: $INSTALLER"
          echo "path=$INSTALLER" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$INSTALLER")" >> "$GITHUB_OUTPUT"

      # EV code-signing via SSL.com eSigner Cloud (cloud HSM — no physical token).
      # Skipped unless dispatched with sign=true. Until the EV cert is issued to
      # TMBS LLC (gated on the D-U-N-S propagating at D&B), keep sign=false
      # (default) and the installer ships unsigned. Required repo secrets (see
      # docs/code-signing-setup.md): SSL_COM_USERNAME, SSL_COM_PASSWORD,
      # SSL_COM_TOTP_SECRET, SSL_COM_CREDENTIAL_ID.
      # NOTE: the eSigner action is x64-tested. arm64 (windows-11-arm) signing
      # needs validation on the first signed run; if it fails there, sign the
      # arm64 slice from the x64 runner instead.
      - name: Code-sign installer (SSL.com eSigner Cloud)
        if: ${{ inputs.sign == true }}
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.SSL_COM_USERNAME }}
          password: ${{ secrets.SSL_COM_PASSWORD }}
          totp_secret: ${{ secrets.SSL_COM_TOTP_SECRET }}
          credential_id: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          file_path: ${{ steps.artifact.outputs.path }}
          override: true
          malware_block: false

      # PSYCO: push the installer straight to the Vercel Blob that backs the
      # download page (download.vpn.vu / download.psyco.lol). This bypasses the
      # GitHub Actions artifact storage quota entirely and lands the .exe where
      # users download it. Fixed pathname (no random suffix) so the page's
      # redirects keep pointing at it across builds.
      - name: Upload installer to Vercel Blob (download page)
        shell: bash
        env:
          BLOB_RW_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          # @vercel/blob SDK uploads with just the RW token (the `vercel blob put`
          # CLI wrongly demands an account login, which CI doesn't have).
          npm install @vercel/blob --no-save
          node scripts/upload-blob.mjs \
            "${{ steps.artifact.outputs.path }}" \
            "vpnvu/vpnvu-windows-${{ matrix.artifact-suffix }}.exe"

      # Kept for traceability, but non-fatal: the GitHub artifact quota recalculates
      # only every 6-12h, so this can fail while the Blob upload above still succeeds.
      - name: Upload installer artifact (GitHub, best-effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vpnvu-windows-${{ matrix.artifact-suffix }}-${{ steps.version.outputs.version }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30

    outputs:
      version: ${{ steps.version.outputs.version }}

  # ----------------------------------------------------------------------
  # Future: Linux x64 build (scaffolding, commented until needed).
  # ----------------------------------------------------------------------
  # build-linux-x64:
  #   name: Build Linux x64 (.deb + .rpm)
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         submodules: recursive
  #         fetch-depth: 0
  #     - uses: ./.github/actions/mullvad-build-env
  #       with:
  #         rust-cache-targets: "true"
  #     - name: Install Linux build deps
  #       run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev rpm
  #     - name: Install desktop dependencies
  #       working-directory: desktop
  #       run: npm run ci
  #     - name: Build daemon + GUI (release)
  #       run: ./build.sh --optimize
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: vpnvu-linux-x64
  #         path: |
  #           dist/*.deb
  #           dist/*.rpm

  # ----------------------------------------------------------------------
  # macOS universal (.pkg) build. Produces an UNSIGNED, un-notarized package
  # until the Apple Developer Program org enrollment lands (gated on the same
  # TMBS LLC D-U-N-S propagating at D&B as the Windows EV cert). The app icon
  # ships from the committed dist-assets/icon-macos.icns — the build does NOT
  # regenerate icons, so no risk of the stale graphics/macOS/ PNGs leaking in.
  # ----------------------------------------------------------------------
  build-macos:
    name: Build macOS universal (.pkg)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build environment (Rust + protoc + Go + Node)
        uses: ./.github/actions/mullvad-build-env
        with:
          rust-cache-targets: "true"

      # Universal binary needs both slices. The runner is Apple Silicon (arm64);
      # the x86_64 slice is cross-compiled, so add that Rust target explicitly.
      - name: Install additional Rust targets
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Cache desktop node_modules
        uses: actions/cache@v4
        with:
          path: |
            desktop/node_modules
            desktop/packages/*/node_modules
          key: ${{ runner.os }}-desktop-node-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-desktop-node-

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building VPN.vu Desktop macOS universal version: $VERSION"

      - name: Install desktop dependencies
        working-directory: desktop
        shell: bash
        run: npm run ci

      # Universal .pkg. With sign=true (and the Apple secrets set), electron-builder
      # signs with the Developer ID and build.sh notarizes via notarytool; otherwise
      # an unsigned package that installs with a Gatekeeper warning (right-click > Open).
      # See docs/code-signing-setup.md for the secrets.
      - name: Build daemon + GUI universal
        shell: bash
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "${{ inputs.sign }}" == "true" ]]; then
            echo "Signed + notarized build (sign=true)"
            # build.sh notarizes the .pkg with notarytool, which needs a keychain
            # profile. Create a throwaway keychain and store the Apple credentials.
            KEYCHAIN="$RUNNER_TEMP/vpnvu-notary.keychain-db"
            security create-keychain -p "" "$KEYCHAIN"
            security set-keychain-settings "$KEYCHAIN"
            security unlock-keychain -p "" "$KEYCHAIN"
            xcrun notarytool store-credentials vpnvu-notary \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$KEYCHAIN"
            export NOTARIZE_KEYCHAIN="$KEYCHAIN"
            export NOTARIZE_KEYCHAIN_PROFILE="vpnvu-notary"
            ./build.sh --optimize --universal --notarize
          else
            echo "Unsigned build (sign=false) — installs with a Gatekeeper warning"
            ./build.sh --optimize --universal
          fi

      - name: Locate .pkg artifact
        id: artifact
        shell: bash
        run: |
          PKG=$(ls -1 dist/*.pkg 2>/dev/null | head -n1 || true)
          if [[ -z "$PKG" ]]; then
            echo "ERROR: No .pkg found in dist/"
            ls -la dist/ || true
            exit 1
          fi
          echo "Found package: $PKG"
          echo "path=$PKG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$PKG")" >> "$GITHUB_OUTPUT"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpnvu-macos-universal-${{ steps.version.outputs.version }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    # Publish as long as Windows produced an installer, even if the newer,
    # less battle-tested macOS job failed — ship what built instead of blocking
    # the whole release on Mac. always() lets this run despite a failed need;
    # the explicit guard keeps it gated on a successful Windows build.
    if: ${{ always() && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "Artifacts downloaded:"
          find artifacts -type f -printf "%P\n"

      - name: Resolve tag name
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ needs.build-windows.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: VPN.vu Desktop ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          # Why false: the macOS job can fail independently (release still runs
          # via always() when Windows succeeds) and the Linux job is still
          # commented out — so .pkg/.deb/.rpm patterns may match nothing. A
          # strict check would fail the release even when the Windows .exe (and
          # possibly the .pkg) built fine.
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.pkg
